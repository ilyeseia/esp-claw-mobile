<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ESP-Claw</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1f2630; --text:#e6edf3; --muted:#8b98a8;
  --accent:#ff6a3d; --accent-2:#ff8a5c; --on-accent:#fff; --border:#2a323d;
  --ok:#3fb950; --warn:#d29922; --err:#f85149; --shadow:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#eceff3; --text:#1b2330; --muted:#617083;
  --border:#dde2e9; --shadow:0 6px 20px rgba(20,30,50,.12); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100dvh}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;
  background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.pill{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--panel2);
  font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill[data-s="online"] i{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.2)}
.pill[data-s="online"]{color:var(--text)}
.pill[data-s="connecting"] i{background:var(--warn);animation:pulse 1s infinite}
.pill[data-s="offline"] i{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}

/* layout */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}

/* nav */
nav{display:flex;background:var(--panel);border-top:1px solid var(--border)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;
  color:var(--muted);font-size:11.5px}
nav button svg{width:23px;height:23px}
nav button.active{color:var(--accent)}

/* chat */
#banner{display:none;margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:rgba(248,81,73,.12);
  border:1px solid rgba(248,81,73,.35);font-size:13px;align-items:center;gap:10px;justify-content:space-between}
#banner.show{display:flex}
#banner button{color:var(--accent);font-weight:600;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
.empty .big{font-size:46px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{padding:8px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--border);font-size:13.5px;color:var(--text)}
.chip:active{background:var(--panel2)}
.m{display:flex;flex-direction:column;max-width:86%;gap:3px}
.m.u{align-self:flex-end;align-items:flex-end}
.m.a{align-self:flex-start;align-items:flex-start}
.b{padding:9px 13px;border-radius:18px;word-break:break-word;overflow-wrap:anywhere}
.m.u .b{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-end-end-radius:5px}
.m.a .b{background:var(--panel);border:1px solid var(--border);border-end-start-radius:5px}
.b code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.b pre{margin:6px 0 0;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.28);overflow-x:auto;direction:ltr;text-align:left}
.b pre code{background:none;padding:0}
.b a{color:inherit;text-decoration:underline}
.m.a .b a{color:var(--accent)}
.meta{font-size:11px;color:var(--muted);display:flex;gap:8px;padding:0 4px}
.meta .fail{color:var(--err);font-weight:600}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att img{max-width:180px;max-height:150px;border-radius:12px;display:block;border:1px solid var(--border)}
.att a,.att span{padding:5px 10px;border-radius:99px;background:var(--panel2);font-size:12.5px;color:var(--text);text-decoration:none}
#typing{display:none;align-self:flex-start;padding:11px 15px;border-radius:18px;background:var(--panel);border:1px solid var(--border);gap:5px}
#typing.show{display:flex}
#typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
#typing i:nth-child(2){animation-delay:.15s}#typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

#pending{display:none;gap:8px;padding:8px 12px 0;overflow-x:auto}
#pending.show{display:flex}
.pf{position:relative;flex:none}
.pf img{width:58px;height:58px;object-fit:cover;border-radius:11px;border:1px solid var(--border)}
.pf button{position:absolute;top:-6px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;background:var(--err);
  color:#fff;font-size:13px;line-height:20px}
#composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:var(--bg)}
#composer textarea{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 14px;border-radius:22px;
  background:var(--panel);border:1px solid var(--border);outline:none}
#composer textarea:focus{border-color:var(--accent)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
#attach{background:var(--panel2);color:var(--muted)}
#sendBtn{background:var(--accent);color:var(--on-accent)}
#sendBtn:disabled{opacity:.45}
[dir="rtl"] #sendBtn svg{transform:scaleX(-1)}

/* cards & forms */
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-weight:600;text-align:end;direction:ltr;unicode-bidi:plaintext}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.tag.ok{background:rgba(63,185,80,.16);color:var(--ok)}
.tag.bad{background:rgba(248,81,73,.16);color:var(--err)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;border-radius:13px;
  background:var(--panel2);font-weight:600;margin-top:9px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:rgba(248,81,73,.14);color:var(--err)}
.btn:disabled{opacity:.5}
.btn svg{width:19px;height:19px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=text],select{width:100%;padding:11px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--border);outline:none}
input[type=text]{direction:ltr;text-align:start}
input:focus,select:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
#scanRes{margin-top:10px;font-size:13.5px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0;color:var(--text);font-size:15px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--border);position:relative;transition:.2s;outline:none}
input[type=checkbox]::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;
  background:var(--muted);transition:.2s}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{inset-inline-start:22px;background:#fff}
#testRes{margin-top:10px;font-size:13.5px;min-height:20px}
#testRes.ok{color:var(--ok)}#testRes.bad{color:var(--err)}

/* device panel overlay */
#panel{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:30}
#panel.show{display:flex}
#panel .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border)}
#panel .bar b{flex:1;font-size:15px}
#panel iframe{flex:1;border:0;width:100%;background:#fff}
.tb{padding:8px 12px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:13.5px}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;width:100%;max-width:340px;box-shadow:var(--shadow)}
#modal h4{margin:0 0 6px;font-size:17px}#modal p{margin:0 0 16px;color:var(--muted)}
#modal .acts{display:flex;gap:10px}#modal .acts button{flex:1;padding:11px;border-radius:12px;background:var(--panel2);font-weight:600}
#modal .acts .ok{background:var(--accent);color:var(--on-accent)}
#toast{position:fixed;inset-inline:16px;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast div{background:var(--panel2);border:1px solid var(--border);padding:10px 16px;border-radius:99px;box-shadow:var(--shadow);
  font-size:13.5px;opacity:0;transform:translateY(8px);transition:.25s}
#toast div.show{opacity:1;transform:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">🦞</div>
      <div><b>ESP-Claw</b><small id="hostLabel"></small></div>
    </div>
    <div class="pill" id="conn" data-s="offline"><i></i><span id="connText"></span></div>
  </header>

  <main>
    <!-- CHAT -->
    <section id="v-chat" class="view active">
      <div id="banner"><span id="bannerText"></span><button id="bannerBtn" data-i="settings"></button></div>
      <div id="msgs"></div>
      <div id="pending"></div>
      <div id="composer">
        <button class="ib" id="attach" aria-label="attach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>
        </button>
        <textarea id="input" rows="1" dir="auto"></textarea>
        <button class="ib" id="sendBtn" aria-label="send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5a1 1 0 000-1.8L3.4 3.6a1 1 0 00-1.4 1.2L4.2 11l9 1-9 1-2.2 6.2a1 1 0 001.4 1.2z"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </section>

    <!-- CONTROL -->
    <section id="v-control" class="view">
      <div class="scroll">
        <div class="card">
          <h3 data-i="deviceStatus"></h3>
          <div id="statusRows"></div>
          <button class="btn" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg><span data-i="refresh"></span></button>
        </div>
        <div class="card">
          <h3 data-i="quick"></h3>
          <div class="chips" style="justify-content:flex-start;margin:0" id="quickChips"></div>
        </div>
        <div class="card">
          <h3 data-i="actions"></h3>
          <button class="btn primary" id="openPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg><span data-i="openPanel"></span></button>
          <button class="btn" id="openBrowser"><span data-i="openBrowser"></span></button>
          <button class="btn danger" id="restartBtn"><span data-i="restart"></span></button>
        </div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="v-settings" class="view">
      <div class="scroll">
        <div class="card">
          <h3 data-i="connection"></h3>
          <label for="hostInput" data-i="deviceAddress"></label>
          <input type="text" id="hostInput" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.76">
          <div class="hint" data-i="addressHint"></div>
          <button class="btn primary" id="saveHost"><span data-i="saveConnect"></span></button>
          <div id="testRes"></div>
          <button class="btn" id="scanBtn"><span data-i="scan"></span></button>
          <div id="scanRes"></div>
        </div>
        <div class="card">
          <h3 data-i="notifications"></h3>
          <label class="switch" for="bgToggle"><span data-i="bgLabel"></span><input type="checkbox" id="bgToggle"></label>
          <div class="hint" data-i="bgHint"></div>
        </div>
        <div class="card">
          <h3 data-i="appearance"></h3>
          <label for="langSel" data-i="language"></label>
          <select id="langSel"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option></select>
          <label for="themeSel" data-i="theme"></label>
          <select id="themeSel"><option value="auto" data-i="themeAuto"></option><option value="dark" data-i="themeDark"></option><option value="light" data-i="themeLight"></option></select>
        </div>
        <div class="card">
          <h3 data-i="conversation"></h3>
          <button class="btn danger" id="newChat"><span data-i="newChat"></span></button>
          <div class="hint" data-i="newChatHint"></div>
        </div>
        <div class="hint" style="text-align:center;padding:4px 0 14px" id="about"></div>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="chat" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-5.7A8 8 0 1121 12z"/></svg>
      <span data-i="tabChat"></span></button>
    <button data-tab="control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span data-i="tabControl"></span></button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      <span data-i="tabSettings"></span></button>
  </nav>
</div>

<div id="panel">
  <div class="bar">
    <button class="tb" id="panelBack">&#8592;</button>
    <b data-i="openPanel"></b>
    <button class="tb" id="panelReload">&#8635;</button>
  </div>
  <iframe id="frame" title="device"></iframe>
</div>
<div id="modal"><div class="box"><h4 id="mTitle"></h4><p id="mText"></p>
  <div class="acts"><button id="mNo"></button><button class="ok" id="mYes"></button></div></div></div>
<div id="toast"></div>

<script>

/* ---------------- native HTTP bridge ---------------- */
const pending = new Map(); let rid = 0;
window.__http = (id, status, body) => { const r = pending.get(id); if (r) { pending.delete(id); r({ status, body }); } };
function bridge(kind, a, b, c, timeout) {
  return new Promise((resolve) => {
    const id = 'r' + (++rid);
    const timer = setTimeout(() => { if (pending.delete(id)) resolve({ status: 0, body: 'timeout' }); }, timeout || 30000);
    pending.set(id, (r) => { clearTimeout(timer); resolve(r); });
    if (NATIVE) {
      if (kind === 'http') window.Android.http(id, baseUrl(), a, b, c == null ? '' : c);
      else window.Android.upload(id, baseUrl(), a, b);
    } else if (kind === 'http') {
      fetch(baseUrl() + b, { method: a, body: c || undefined })
        .then(async (res) => window.__http(id, res.status, await res.text()))
        .catch((e) => window.__http(id, 0, String(e)));
    } else {
      window.__http(id, 0, 'upload needs the Android app');
    }
  });
}
const api = (method, path, body, timeout) => bridge('http', method, path, body, timeout);
const parse = (s) => { try { return JSON.parse(s); } catch (e) { return null; } };
const absUrl = (u) => (u && u.charAt(0) === '/' ? baseUrl() + u : u);
function openUrl(u) { u = absUrl(u); if (NATIVE) window.Android.openUrl(u); else window.open(u, '_blank'); }

/* ---------------- markdown (small, safe) ---------------- */
function md(src) {
  const hold = [];
  const put = (html) => { hold.push(html); return '␀' + (hold.length - 1) + '␀'; };
  let s = esc(String(src).replace(/␀/g, ''));
  s = s.replace(/```([\s\S]*?)```/g, (m, c) => put('<pre><code>' + c.replace(/^\w*\n/, '') + '</code></pre>'));
  s = s.replace(/`([^`\n]+)`/g, (m, c) => put('<code>' + c + '</code>'));
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*)\)/g, (m, txt, u) => put('<a href="' + u + '">' + txt + '</a>'));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, p, u) => p + put('<a href="' + u + '">' + u + '</a>'));
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/^#{1,3} +(.+)$/gm, '<strong>$1</strong>');
  s = s.replace(/^[-*] +/gm, '• ');
  s = s.replace(/\n/g, '<br>');
  return s.replace(/␀(\d+)␀/g, (m, i) => hold[+i]);
}

msgs.forEach((m) => { if (m.status === 'pending') m.status = 'failed'; });

const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const isImg = (u) => /\.(png|jpe?g|gif|webp)(\?|$)/i.test(u || '');

function msgHtml(m, i) {
  let inner = '';
  if (m.text) inner = '<div class="b" dir="auto">' + md(m.text) + '</div>';
  let att = '';
  (m.links || []).forEach((l) => {
    const u = absUrl(l.url);
    att += isImg(l.url) ? '<a href="' + esc(u) + '"><img loading="lazy" src="' + esc(u) + '" alt=""></a>'
                        : '<a href="' + esc(u) + '">📎 ' + esc(l.label || l.url) + '</a>';
  });
  (m.files || []).forEach((f) => {
    att += f.thumb ? '<img src="' + f.thumb + '" alt="">' : '<span>📎 ' + esc(f.name) + '</span>';
  });
  if (att) att = '<div class="att">' + att + '</div>';
  const fail = m.status === 'failed' ? '<span class="fail" data-retry="' + i + '">' + esc(t('sendFailed')) + '</span>' : '';
  return '<div class="m ' + (m.role === 'user' ? 'u' : 'a') + '">' + inner + att +
         '<div class="meta"><span>' + fmtTime(m.ts) + '</span>' + fail + '</div></div>';
}

function renderMsgs() {

/* ---------------- websocket ---------------- */
let ws = null, hb = null, reconnectT = null, connectT = null, backoff = 2000, connState = 'offline';
function setConn(state) {
  connState = state;
  $('conn').dataset.s = state; $('connText').textContent = t(state);
  $('hostLabel').textContent = host;
  const showBanner = state === 'offline' && curTab === 'chat';
  $('banner').classList.toggle('show', showBanner);
  $('bannerText').textContent = t('bannerOffline');
}
function teardown() {
  clearInterval(hb); clearTimeout(reconnectT); clearTimeout(connectT);
  if (ws) { const s = ws; ws = null; s.onopen = s.onclose = s.onerror = s.onmessage = null; try { s.close(); } catch (e) { /* ignore */ } }
}
function scheduleReconnect() {
  clearTimeout(reconnectT);
  reconnectT = setTimeout(connect, backoff);
  backoff = Math.min(backoff * 1.5, 8000);
}
function connect() {
  teardown(); setConn('connecting');
  let s;
  try { s = new WebSocket('ws://' + host + '/ws/webim'); } catch (e) { setConn('offline'); scheduleReconnect(); return; }
  ws = s;
  connectT = setTimeout(() => { if (ws === s && s.readyState === 0) { try { s.close(); } catch (e) { /* ignore */ } } }, 8000);
  s.onopen = () => {
    clearTimeout(connectT); backoff = 2000; setConn('online');
    try { s.send(JSON.stringify({ type: 'hello', chat_id: chatId })); } catch (e) { /* ignore */ }
    hb = setInterval(() => { if (s.readyState === 1) { try { s.send('{"type":"ping"}'); } catch (e) { /* ignore */ } } }, 15000);
  };
  s.onclose = () => { if (ws !== s) return; clearInterval(hb); setConn('offline'); scheduleReconnect(); };
  s.onerror = () => { /* onclose follows */ };
  s.onmessage = (ev) => {
    const d = parse(ev.data);
    if (!d || d.chat_id !== chatId || d.role !== 'assistant') return;
    msgs.push({ role: 'assistant', text: String(d.text || ''), links: Array.isArray(d.links) ? d.links : [], ts: Date.now() });
    saveMsgs(); setTyping(false); renderMsgs(); scrollDown();
  };
}
// With background notifications on, the native service owns the socket while the app is hidden,
// so the page drops its own connection (no duplicates) and re-syncs when it comes back.
let bgOn = NATIVE && store.get('bg', '0') === '1';
const syncBg = () => (NATIVE ? window.Android.setBackground(bgOn, host, chatId) : true);
function drainBg() {
  if (!NATIVE) return;
  const arr = parse(window.Android.drainMessages());
  if (!Array.isArray(arr) || !arr.length) return;
  arr.forEach((o) => msgs.push({ role: 'assistant', text: String(o.text || ''), links: Array.isArray(o.links) ? o.links : [], ts: o.ts || Date.now() }));
  saveMsgs(); setTyping(false); renderMsgs(); scrollDown();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (bgOn) teardown(); return; }
  if (bgOn) drainBg();
  if (!ws || ws.readyState > 1) { backoff = 2000; connect(); }
});

let pendingFiles = [];
async function postMessage(m) {
  m.status = 'pending'; saveMsgs();
  const body = JSON.stringify({ chat_id: chatId, text: m.text || '', files: (m.files || []).map((f) => f.path) });
  const r = await api('POST', '/api/webim/send', body, 20000);
  m.status = r.status >= 200 && r.status < 300 ? 'sent' : 'failed';
  if (m.status === 'sent') setTyping(true);
  saveMsgs(); renderMsgs();
}
async function send(text) {
  text = (text || '').trim();
  const files = pendingFiles.slice();
  if (!text && !files.length) return;
  if (connState !== 'online') { toast(t('notConnected')); return; }
  const m = { role: 'user', text, files, ts: Date.now(), status: 'pending' };
  msgs.push(m); pendingFiles = []; renderPending(); renderMsgs(); scrollDown();
  await postMessage(m);
}
$('sendBtn').onclick = () => { const v = $('input').value; $('input').value = ''; autoGrow(); send(v); };

function renderPending() {
  const box = $('pending'); box.classList.toggle('show', pendingFiles.length > 0);
  box.innerHTML = pendingFiles.map((f, i) => '<div class="pf"><img src="' + f.thumb + '" alt=""><button data-rm="' + i + '">×</button></div>').join('');
}
$('pending').addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (b) { pendingFiles.splice(+b.dataset.rm, 1); renderPending(); } });
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
function toJpeg(img, maxPx, quality) {
  const k = Math.min(1, maxPx / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}
$('attach').onclick = () => $('file').click();
$('file').onchange = async () => {
  const file = $('file').files[0]; $('file').value = '';
  if (!file) return;
  try {
    const img = await loadImage(file);
    const full = toJpeg(img, IMG_MAX_PX, 0.8), thumb = toJpeg(img, THUMB_PX, 0.6);
    const name = Date.now().toString(36) + '.jpg', path = '/inbox/webim/' + name;
    await api('POST', '/api/files/mkdir', JSON.stringify({ path: '/inbox/webim', recursive: true }));
    const r = await bridge('upload', path, full.split(',')[1]);
    if (r.status < 200 || r.status >= 300) throw new Error('upload ' + r.status);
    pendingFiles.push({ path, name, thumb }); renderPending(); toast(t('uploaded'));
  } catch (e) { toast(t('attachFail')); }
};

};
window.__perm = (ok) => toast(ok ? t('bgOk') : t('bgPermHint'));
$('langSel').onchange = () => { lang = $('langSel').value; store.set('lang', lang); applyI18n(); };
$('themeSel').onchange = () => { theme = $('themeSel').value; store.set('theme', theme); applyTheme(); };
$('newChat').onclick = async () => {
  if (!(await confirmBox(t('newChat'), t('newChatHint')))) return;
  chatId = uuid(); store.set('chatId', chatId); msgs = []; saveMsgs(); setTyping(false); renderMsgs();
  if (bgOn) syncBg();
  if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify({ type: 'hello', chat_id: chatId })); } catch (e) { /* ignore */ } }
  goTab('chat');
};
$('bannerBtn').onclick = () => goTab('settings');

/* ---------------- tabs ---------------- */
let curTab = 'chat', statusTimer = null;
function goTab(name) {
  curTab = name;
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'v-' + name));
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  clearInterval(statusTimer);
  if (name === 'control') { refreshStatus(); statusTimer = setInterval(refreshStatus, 10000); }
  // Measure the composer only once the chat view is laid out (a hidden/unsized textarea reports a bogus height).
  if (name === 'chat') { autoGrow(); scrollDown(); }
  if (name === 'settings') $('hostInput').value = host;
  setConn(connState);
}
document.querySelectorAll('nav button').forEach((b) => { b.onclick = () => goTab(b.dataset.tab); });

// Called by the native side on the Back button; true = handled here.
window.__onBack = () => {
  if ($('modal').classList.contains('show')) { $('mNo').click(); return true; }
  if ($('panel').classList.contains('show')) { closePanel(); return true; }
  if (curTab !== 'chat') { goTab('chat'); return true; }
  return false;
};

/* ---------------- boot ---------------- */
$('langSel').value = lang; $('themeSel').value = theme; $('hostInput').value = host;
applyTheme(); applyI18n(); connect();
if (bgOn) { drainBg(); syncBg(); }
if (!store.get('host', '')) goTab('settings');
})();
</script>
</body>
</html>
